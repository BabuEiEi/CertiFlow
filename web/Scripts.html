<script>
  /**
   * CertiFlow Frontend Controller (Vanilla JavaScript)
   */

  // Global State Storage
  window.CertiFlowState = {
    activities: [],
    participants: [],
    certificates: [],
    users: [],
    validatedImportData: null,
    currentUser: null,
    selectedCertIds: [],
    renderedCertIds: [],
    bulkCancelRequested: false
  };

  const AUTH_TOKEN_KEY = 'certiflowAuthToken';

  function getAuthToken() {
    try { return sessionStorage.getItem(AUTH_TOKEN_KEY) || ''; }
    catch (e) { return ''; }
  }

  function setAuthToken(token) {
    try {
      if (token) sessionStorage.setItem(AUTH_TOKEN_KEY, token);
      else sessionStorage.removeItem(AUTH_TOKEN_KEY);
    } catch (e) {}
  }

  /**
   * Standardized API Call Bridge via google.script.run
   * @param {string} action
   * @param {Object} [payload={}]
   * @return {Promise<Object>}
   */
  function callApi(action, payload = {}, _retried = false) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        const requestPayload = { ...(payload || {}) };
        const authToken = getAuthToken();
        if (authToken && !requestPayload.authToken) requestPayload.authToken = authToken;
        google.script.run
          .withSuccessHandler((response) => {
            if (response && response.success) {
              resolve(response.data);
            } else if (!response && !_retried) {
              // A completely empty response (no error message at all) is the signature of a
              // transient google.script.run bridge glitch inside Apps Script's nested sandbox
              // iframe, not a real application error (real failures always carry a Thai message
              // from Utils.buildResponse). Retry once silently before surfacing anything.
              callApi(action, payload, true).then(resolve).catch(reject);
            } else {
              const message = response ? response.error : 'Unknown server error';
              if (message && message.includes('กรุณาเข้าสู่ระบบ Management Mode')) {
                setAuthToken('');
                showLoginModal();
              }
              reject(new Error(message));
            }
          })
          .withFailureHandler((err) => {
            reject(new Error(err.message || String(err)));
          })
          .apiCall(action, requestPayload);
      } else {
        // Fallback for offline or local preview
        console.warn('google.script.run unavailable. Mock mode active for:', action);
        reject(new Error('google.script.run is not available in local mode. Deploy Web App to execute API.'));
      }
    });
  }

  /**
   * Helper: Alert / Toast Notification (SweetAlert2, themed navy/gold)
   */
  function showAlert(msg, isError = false) {
    if (typeof Swal === 'undefined') {
      alert((isError ? 'ข้อผิดพลาด: ' : '') + msg);
      return;
    }
    Swal.fire({
      icon: isError ? 'error' : 'success',
      title: isError ? 'เกิดข้อผิดพลาด' : 'สำเร็จ',
      text: msg,
      confirmButtonColor: '#182236',
      confirmButtonText: 'ตกลง'
    });
  }

  /** Non-blocking top-right status toast for background actions (e.g. preparing a download). */
  function showToast(msg, icon = 'info') {
    if (typeof Swal === 'undefined') return;
    Swal.fire({
      toast: true,
      position: 'top-end',
      icon: icon,
      title: msg,
      showConfirmButton: false,
      timer: 2500,
      timerProgressBar: true
    });
  }

  /** Promise-based confirm dialog; resolves true only when the user confirms. */
  function showConfirm(message, title = 'ยืนยันการทำรายการ') {
    if (typeof Swal === 'undefined') return Promise.resolve(confirm(message));
    return Swal.fire({
      icon: 'warning',
      title: title,
      text: message,
      showCancelButton: true,
      confirmButtonColor: '#b91c1c',
      cancelButtonColor: '#475569',
      confirmButtonText: 'ยืนยัน',
      cancelButtonText: 'ยกเลิก'
    }).then((result) => result.isConfirmed);
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  /** Formats an ISO date (YYYY-MM-DD, from <input type="date">) as a Thai Buddhist-era date.
   *  Falls back to the raw value for anything else (legacy free-text dates, empty). */
  function formatThaiDate(value) {
    if (!value) return '-';
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return value;
    const [, year, month, day] = match;
    const monthName = THAI_MONTHS[parseInt(month, 10) - 1];
    if (!monthName) return value;
    return `${parseInt(day, 10)} ${monthName} ${parseInt(year, 10) + 543}`;
  }

  /** Reverse of formatThaiDate: parses "1 กันยายน 2569" back into "2026-09-01" for
   *  populating a native <input type="date">. Returns '' when it can't be parsed
   *  (e.g. already ISO, empty, or unrecognized legacy text) so the picker just stays blank. */
  function parseThaiDateToISO(value) {
    if (!value) return '';
    const match = /^(\d{1,2})\s+(\S+)\s+(\d{4})$/.exec(String(value).trim());
    if (!match) return '';
    const [, day, monthName, buddhistYear] = match;
    const monthIndex = THAI_MONTHS.indexOf(monthName);
    if (monthIndex === -1) return '';
    const year = parseInt(buddhistYear, 10) - 543;
    return `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(parseInt(day, 10)).padStart(2, '0')}`;
  }

  /** Sheets auto-converts an ISO-looking string like "2026-09-01" into a real Date
   *  cell, which then breaks google.script.run's RPC serialization on read. Store a
   *  Thai-formatted display string instead so the cell always stays plain text. */
  function dateInputToStoredValue(isoValue) {
    return isoValue ? formatThaiDate(isoValue) : '';
  }

  /**
   * DOM Ready Initialization Handler
   */
  document.addEventListener('DOMContentLoaded', function() {
    // Apps Script's sandbox wrapper can re-fire page initialization inside the
    // same document (observed as this handler running twice in one session);
    // guard against double-init causing duplicate overlapping API calls.
    if (window.__certiflowInitialized) return;
    window.__certiflowInitialized = true;

    console.log('CertiFlow frontend initialized.');

    // Public pages do not require a management session.
    if (document.getElementById('publicSearchSection')) {
      initPublicSearch();
    } else if (document.getElementById('verifySection')) {
      initVerifyPage();
    } else {
      initializeManagementAuth();
    }
  });

  /**
   * Mobile side-navigation drawer. On lg screens the sidebar is permanently
   * visible (lg:translate-x-0), so this only drives the small-screen drawer.
   * @param {boolean} [show] Omit to toggle.
   */
  function toggleSideNav(show) {
    const nav = document.getElementById('sideNav');
    const overlay = document.getElementById('navOverlay');
    if (!nav) return;
    const shouldShow = show === undefined ? nav.classList.contains('-translate-x-full') : show;
    nav.classList.toggle('-translate-x-full', !shouldShow);
    if (overlay) overlay.classList.toggle('hidden', !shouldShow);
  }

  function showLoginModal(message = '') {
    const modal = document.getElementById('loginModal');
    const errorBox = document.getElementById('loginError');
    if (modal) modal.classList.remove('hidden');
    if (errorBox) {
      errorBox.textContent = message;
      errorBox.classList.toggle('hidden', !message);
    }
  }

  function initializeManagementAuth() {
    if (!getAuthToken()) {
      showLoginModal();
      return;
    }
    callApi('session')
      .then((user) => {
        if (!user || user.isPublicUser) {
          setAuthToken('');
          showLoginModal('Session หมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง');
          return;
        }
        activateManagementSession(user);
      })
      .catch(() => {
        setAuthToken('');
        showLoginModal('ไม่สามารถตรวจสอบ Session ได้ กรุณาเข้าสู่ระบบอีกครั้ง');
      });
  }

  function handleLogin(event) {
    event.preventDefault();
    const userId = document.getElementById('loginUserId').value.trim();
    const password = document.getElementById('loginPassword').value;
    const button = document.getElementById('btnLogin');
    const errorBox = document.getElementById('loginError');
    if (button) {
      button.disabled = true;
      button.textContent = 'กำลังเข้าสู่ระบบ...';
    }
    if (errorBox) errorBox.classList.add('hidden');

    callApi('login', { userId, password })
      .then((result) => {
        setAuthToken(result.authToken);
        document.getElementById('loginPassword').value = '';
        activateManagementSession(result.user);
      })
      .catch((error) => showLoginModal(error.message))
      .finally(() => {
        if (button) {
          button.disabled = false;
          button.textContent = 'เข้าสู่ระบบ';
        }
      });
  }

  function activateManagementSession(user) {
    CertiFlowState.currentUser = user;
    const modal = document.getElementById('loginModal');
    const badge = document.getElementById('authUserBadge');
    const logoutButton = document.getElementById('btnLogout');
    if (modal) modal.classList.add('hidden');
    if (badge) {
      badge.textContent = `${user.name} (${user.role})`;
      badge.classList.remove('hidden');
    }
    if (logoutButton) logoutButton.classList.remove('hidden');

    document.querySelectorAll('[data-admin-only]').forEach(element => {
      element.classList.toggle('hidden', user.role !== 'ADMIN');
    });

    if (document.getElementById('settingsSection') && user.role !== 'ADMIN') {
      document.getElementById('appContainer').innerHTML = `
        <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-6 text-center">
          หน้านี้สำหรับ ADMIN เท่านั้น
        </div>`;
      return;
    }

    if (document.getElementById('dashboardSection')) loadDashboardData();
    if (document.getElementById('activitiesSection')) loadActivitiesList();
    if (document.getElementById('participantsSection')) initParticipantsPage();
    if (document.getElementById('certificatesSection')) initCertificatesPage();
    if (document.getElementById('settingsSection')) initSettingsPage();
  }

  function handleLogout() {
    callApi('logout')
      .catch(() => null)
      .finally(() => {
        setAuthToken('');
        CertiFlowState.currentUser = null;
        const publicLink = document.getElementById('publicModeLink');
        const target = (publicLink && publicLink.href) || window.CERTIFLOW_WEB_APP_URL || '';
        // Apps Script's HtmlService sandbox iframe never reflects the real page
        // URL in this frame's own window.location, so navigating must target
        // the actual top-level browsing context, not this frame.
        try { window.top.location.href = target; }
        catch (e) { window.location.href = target; }
      });
  }

  /* ==========================================================================
     1. PUBLIC SEARCH & PREVIEW & DOWNLOAD & VERIFY
     ========================================================================== */

  function initPublicSearch() {
    loadPublicActivitiesDropdown();
    const btnSearch = document.getElementById('btnSearch');
    if (btnSearch) {
      btnSearch.addEventListener('click', handlePublicSearch);
    }
    const searchInput = document.getElementById('searchQuery');
    if (searchInput) {
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handlePublicSearch();
      });
    }
  }

  function loadPublicActivitiesDropdown() {
    callApi('activities')
      .then((activities) => {
        CertiFlowState.activities = activities || [];
        const select = document.getElementById('searchActivity');
        if (!select) return;
        select.innerHTML = '<option value="">-- กิจกรรมทั้งหมด --</option>';
        activities.forEach((act) => {
          if (act.status === 'ACTIVE' || act.status === 'CLOSED') {
            const opt = document.createElement('option');
            opt.value = act.activityId;
            opt.textContent = act.activityName;
            select.appendChild(opt);
          }
        });
      })
      .catch((err) => console.log('Could not load activities dropdown:', err));
  }

  function handlePublicSearch() {
    const activityId = document.getElementById('searchActivity') ? document.getElementById('searchActivity').value : '';
    const query = document.getElementById('searchQuery') ? document.getElementById('searchQuery').value.trim() : '';
    const resultsContainer = document.getElementById('searchResults');

    if (!resultsContainer) return;
    resultsContainer.innerHTML = '<div class="bg-white p-6 rounded-xl border text-center text-slate-500">กำลังค้นหา...</div>';

    callApi('search', { activityId, q: query, page: 1, pageSize: 20 })
      .then((data) => {
        renderSearchResults(data.results || []);
      })
      .catch((err) => {
        resultsContainer.innerHTML = `<div class="bg-rose-50 p-6 rounded-xl border border-rose-200 text-center text-rose-700">เกิดข้อผิดพลาดในการค้นหา: ${escapeHtml(err.message)}</div>`;
      });
  }

  function renderSearchResults(results) {
    const container = document.getElementById('searchResults');
    if (!container) return;

    if (!results || results.length === 0) {
      container.innerHTML = '<div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-500">ไม่พบข้อมูลเกียรติบัตรที่ตรงกับคำค้นหา</div>';
      return;
    }

    const verifyBase = (window.CERTIFLOW_WEB_APP_URL || '') + '?page=verify&id=';

    container.innerHTML = results.map((cert) => `
      <div class="bg-white p-6 rounded-xl border border-slate-200 border-l-4 border-l-navy-800 shadow-sm space-y-3">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-3">
          <div>
            <span class="text-xs font-semibold px-2.5 py-1 bg-navy-50 text-navy-800 rounded-full border border-navy-200">เกียรติบัตรฉบับจริง</span>
            <h3 class="text-lg font-bold text-navy-900 mt-1">${escapeHtml(cert.fullName)}</h3>
            <p class="text-xs text-slate-500">${escapeHtml(cert.school || 'ไม่ระบุสถานศึกษา')}</p>
          </div>
          <div class="text-left sm:text-right">
            <span class="text-xs font-mono text-gold-700 font-bold block">${escapeHtml(cert.certificateNo || '-')}</span>
            <span class="text-xs text-slate-400">วันที่ออก: ${escapeHtml(formatThaiDate(cert.issueDate))}</span>
          </div>
        </div>

        <div class="text-xs text-slate-600 space-y-1">
          <p><span class="font-medium text-slate-700">กิจกรรม:</span> ${escapeHtml(cert.activityName)}</p>
          <p><span class="font-medium text-slate-700">หน่วยงานออก:</span> ${escapeHtml(cert.issueAgency || '-')}</p>
        </div>

        <div class="flex flex-wrap gap-2 pt-2">
          <button onclick="previewCertBlob('${cert.certificateId}')" class="px-3.5 py-1.5 bg-navy-700 hover:bg-navy-800 text-white rounded text-xs font-medium transition">
            ดูตัวอย่าง
          </button>
          <button onclick="downloadCertBlob('${cert.certificateId}', 'pdf')" class="px-3.5 py-1.5 bg-navy-800 hover:bg-navy-900 text-white rounded text-xs font-medium transition">
            ดาวน์โหลด PDF
          </button>
          <button onclick="downloadCertBlob('${cert.certificateId}', 'jpeg')" class="px-3.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded text-xs font-medium transition">
            ดาวน์โหลด JPEG
          </button>
          <a href="${verifyBase}${cert.certificateId}" target="_blank" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium transition">
            ตรวจสอบความถูกต้อง
          </a>
          <button onclick="showQrModal('${cert.certificateId}', '${escapeHtml(cert.verificationUrl || '')}')" class="px-3.5 py-1.5 bg-gold-50 hover:bg-gold-100 text-gold-800 border border-gold-300 rounded text-xs font-medium transition">QR Code</button>
          <button onclick="reportCertificateIssue('${cert.certificateId}')" class="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded text-xs font-medium transition">แจ้งข้อมูลไม่ถูกต้อง</button>
        </div>
      </div>
    `).join('');
  }

  function downloadCertBlob(certificateId, format) {
    showToast(`กำลังเตรียมดาวน์โหลดเกียรติบัตรในรูปแบบ ${format.toUpperCase()} ...`);
    callApi('download', { id: certificateId, format: format })
      .then((res) => {
        if (res && res.base64) {
          const link = document.createElement('a');
          link.href = `data:${res.mimeType};base64,${res.base64}`;
          link.download = res.filename || `Certificate_${certificateId}.${format}`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } else {
          showAlert('ไม่พบข้อมูลไฟล์ที่สร้างกลับมา', true);
        }
      })
      .catch((err) => showAlert(`ดาวน์โหลดล้มเหลว: ${err.message}`, true));
  }

  function openMediaModal(title, contentNode) {
    const modal = document.getElementById('mediaModal');
    const content = document.getElementById('mediaModalContent');
    document.getElementById('mediaModalTitle').textContent = title;
    content.replaceChildren(contentNode);
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function closeMediaModal() {
    const modal = document.getElementById('mediaModal');
    if (!modal) return;
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function previewCertBlob(certificateId) {
    const button = event ? event.currentTarget : null;
    const originalText = button ? button.textContent : '';
    if (button) {
      button.disabled = true;
      button.textContent = 'กำลังสร้าง...';
    }
    callApi('preview', { id: certificateId })
      .then(res => {
        const img = document.createElement('img');
        img.src = `data:${res.mimeType};base64,${res.base64}`;
        img.alt = `ตัวอย่างเกียรติบัตร ${certificateId}`;
        img.className = 'max-w-full h-auto';
        openMediaModal(`ตัวอย่าง ${certificateId}`, img);
      })
      .catch(err => showAlert(`สร้างตัวอย่างไม่สำเร็จ: ${err.message}`, true))
      .finally(() => {
        if (button) {
          button.disabled = false;
          button.textContent = originalText;
        }
      });
  }

  function showQrModal(certificateId, verificationUrl) {
    if (!verificationUrl || typeof QRCode === 'undefined') return showAlert('ไม่สามารถสร้าง QR Code ได้', true);
    const wrapper = document.createElement('div');
    wrapper.className = 'space-y-3 text-center';
    const qr = document.createElement('div');
    qr.className = 'flex justify-center';
    wrapper.appendChild(qr);
    const caption = document.createElement('p');
    caption.className = 'text-xs text-slate-500 break-all';
    caption.textContent = verificationUrl;
    wrapper.appendChild(caption);
    openMediaModal(`QR ตรวจสอบ ${certificateId}`, wrapper);
    new QRCode(qr, { text: verificationUrl, width: 220, height: 220 });
  }

  function reportCertificateIssue(certificateId) {
    if (typeof Swal === 'undefined') {
      const message = prompt('กรุณาระบุข้อมูลที่ไม่ถูกต้อง (อย่างน้อย 10 ตัวอักษร)');
      if (!message) return;
      const contact = prompt('ข้อมูลติดต่อกลับ (ไม่บังคับ)') || '';
      callApi('reportIssue', { id: certificateId, message, contact })
        .then(result => showAlert(`รับแจ้งแล้ว เลขที่ ${result.reportId}`))
        .catch(err => showAlert(`ส่งรายงานไม่สำเร็จ: ${err.message}`, true));
      return;
    }

    Swal.fire({
      title: 'แจ้งข้อมูลไม่ถูกต้อง',
      html: `
        <textarea id="swalReportMessage" class="swal2-textarea" placeholder="ระบุข้อมูลที่ไม่ถูกต้อง (อย่างน้อย 10 ตัวอักษร)" style="height:100px"></textarea>
        <input id="swalReportContact" class="swal2-input" placeholder="ข้อมูลติดต่อกลับ (ไม่บังคับ)">
      `,
      confirmButtonColor: '#182236',
      confirmButtonText: 'ส่งรายงาน',
      showCancelButton: true,
      cancelButtonText: 'ยกเลิก',
      focusConfirm: false,
      preConfirm: () => {
        const message = document.getElementById('swalReportMessage').value.trim();
        const contact = document.getElementById('swalReportContact').value.trim();
        if (message.length < 10) {
          Swal.showValidationMessage('กรุณาระบุรายละเอียดอย่างน้อย 10 ตัวอักษร');
          return false;
        }
        return { message, contact };
      }
    }).then((result) => {
      if (!result.isConfirmed) return;
      callApi('reportIssue', { id: certificateId, message: result.value.message, contact: result.value.contact })
        .then(res => showAlert(`รับแจ้งแล้ว เลขที่ ${res.reportId}`))
        .catch(err => showAlert(`ส่งรายงานไม่สำเร็จ: ${err.message}`, true));
    });
  }

  function initVerifyPage() {
    const params = window.CERTIFLOW_PARAMS || {};
    const certId = params.id || '';
    const container = document.getElementById('verifyStatusContainer');
    const details = document.getElementById('verifyDetails');
    const backLink = document.getElementById('verifyBackLink');
    if (backLink && window.CERTIFLOW_WEB_APP_URL) {
      backLink.href = `${window.CERTIFLOW_WEB_APP_URL}?page=search`;
    }

    if (!certId) {
      if (container) container.innerHTML = '<p class="text-rose-600 font-bold">ไม่พบพารามิเตอร์ ID ใน URL</p>';
      return;
    }

    callApi('verify', { id: certId })
      .then((res) => {
        if (!container) return;
        if (res.valid && res.status === 'ISSUED') {
          container.className = 'p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-base';
          container.innerHTML = `<div>${escapeHtml(res.message)}</div>`;
        } else if (res.status === 'REVOKED') {
          container.className = 'p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 font-bold text-base';
          container.innerHTML = `<div>${escapeHtml(res.message)}</div><p class="text-xs text-rose-600 mt-1 font-normal">เหตุผล: ${escapeHtml(res.revokeReason || '-')}</p>`;
        } else {
          container.className = 'p-4 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 font-bold text-base';
          container.innerHTML = `<div>${escapeHtml(res.message || 'ไม่พบข้อมูลเกียรติบัตร')}</div>`;
        }

        if (res.certificate && details) {
          details.classList.remove('hidden');
          const c = res.certificate;
          details.innerHTML = `
            <div class="space-y-2 text-xs text-slate-700">
              <p><span class="font-bold text-slate-900">Certificate ID:</span> <span class="font-mono">${escapeHtml(c.certificateId)}</span></p>
              <p><span class="font-bold text-slate-900">เลขที่เกียรติบัตร:</span> <span class="font-bold text-gold-700">${escapeHtml(c.certificateNo)}</span></p>
              <p><span class="font-bold text-slate-900">ชื่อผู้รับ:</span> ${escapeHtml(c.fullName)}</p>

  function deleteActivity(activityId) {
    const act = CertiFlowState.activities.find(a => a.activityId === activityId);
    const warning = act && act.status === 'CLOSED'
      ? `ลบกิจกรรม ${activityId} หรือไม่? กิจกรรมนี้ปิดแล้ว (CLOSED) — หากมีผู้เข้าร่วม/เกียรติบัตรผูกอยู่ จะถูกลบตามไปด้วยทั้งหมด และกู้คืนไม่ได้`
      : `ลบกิจกรรม ${activityId} หรือไม่? ระบบจะปฏิเสธหากมีข้อมูลอ้างอิงและยังไม่ได้ปิด (CLOSED)`;
    showConfirm(warning).then((ok) => {
      if (!ok) return;
      callApi('deleteActivity', { activityId })
        .then(() => { showAlert('ลบกิจกรรมเรียบร้อย'); loadActivitiesList(); })

  /* Import columns, in the order used by both the Excel template and the pasted-text format. */
  const IMPORT_FIELDS = ['prefixName', 'firstName', 'lastName', 'school', 'trainingType', 'participantStatus'];

  function parseInputTextToRows(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    return lines.map(line => {
      // Split by comma or tab
      const parts = line.split(/,|\t/).map(p => p.trim());
      return {
        prefixName: parts[0] || '',
        firstName: parts[1] || '',
        lastName: parts[2] || '',
        school: parts[3] || '',
        trainingType: parts[4] || '',
        participantStatus: parts[5] || 'ผ่านการอบรม'
      };
    });
  }

    if (typeof XLSX === 'undefined') return showAlert('ตัวสร้างไฟล์ XLSX โหลดไม่สำเร็จ', true);
    // The heading says the column is optional; header matching tolerates the note
    // because unmatched exact aliases fall back to a substring match.
    const header = ['คำนำหน้า', 'ชื่อ', 'นามสกุล', 'โรงเรียน/หน่วยงาน', 'ด้านการอบรม (เว้นว่างได้)', 'สถานะ'];

      ['นางสาว', 'สมหญิง', 'รักดี', 'โรงเรียนอนุบาล', '', 'เข้าร่วม']
    ];
    const sheet = XLSX.utils.aoa_to_sheet([header, ...sample]);
    sheet['!cols'] = header.map(() => ({ wch: 22 }));

    // Only the first sheet is read on import, so the notes sheet is safe to ship along.
    const notes = XLSX.utils.aoa_to_sheet([
      ['คำแนะนำการกรอกไฟล์นำเข้ารายชื่อ CertiFlow'],
      [''],
      ['คอลัมน์', 'บังคับกรอก?', 'คำอธิบาย'],
      ['คำนำหน้า', 'ไม่บังคับ', 'เช่น นาย / นาง / นางสาว / ดร.'],
      ['ชื่อ', 'บังคับ', 'ชื่อจริงของผู้รับเกียรติบัตร'],
      ['นามสกุล', 'บังคับ', 'นามสกุลของผู้รับเกียรติบัตร'],
      ['โรงเรียน/หน่วยงาน', 'ไม่บังคับ', 'พิมพ์ลงเกียรติบัตรที่ตำแหน่ง {{office}}'],
      ['ด้านการอบรม (เว้นว่างได้)', 'ไม่บังคับ', 'พิมพ์ลงเกียรติบัตรที่ตำแหน่ง {{type}} — เว้นว่างไว้ได้ ระบบจะใช้ "ด้านการอบรม" ที่ตั้งไว้ในหน้ากิจกรรมแทน และถ้ากิจกรรมเลือก "ไม่มี" ก็ปล่อยว่างทั้งคอลัมน์ได้เลย'],
      ['สถานะ', 'ไม่บังคับ', 'ต้องเป็น "ผ่านการอบรม" หรือ "เข้าร่วม" เท่านั้น — เว้นว่างไว้ระบบจะใช้ "ผ่านการอบรม"'],
      [''],
      ['ข้อควรระวัง', '', 'ห้ามลบหรือเปลี่ยนแถวหัวคอลัมน์ในชีต Participants และกรอกข้อมูลต่อจากแถวตัวอย่างได้เลย (ลบแถวตัวอย่างออกก่อนนำเข้าจริง)'],
      ['', '', 'นำเข้าได้สูงสุด 5,000 แถวต่อครั้ง']
    ]);
    notes['!cols'] = [{ wch: 26 }, { wch: 14 }, { wch: 90 }];

    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, 'Participants');
    XLSX.utils.book_append_sheet(workbook, notes, 'คำแนะนำ');
    XLSX.writeFile(workbook, 'CertiFlow_Import_Template.xlsx');
  }

  function handleImportFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (typeof XLSX === 'undefined') return showAlert('ตัวอ่านไฟล์ XLSX โหลดไม่สำเร็จ', true);
    const reader = new FileReader();
    reader.onload = function(loadEvent) {
      try {
        const workbook = XLSX.read(loadEvent.target.result, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (!matrix.length) throw new Error('ไฟล์ไม่มีข้อมูล');
        const aliases = {
          prefixName: ['prefixname', 'คำนำหน้า', 'คำนำหน้าชื่อ'],
          firstName: ['firstname', 'ชื่อ'],
          lastName: ['lastname', 'นามสกุล'],
          // The bundled template ships "โรงเรียน/หน่วยงาน"; normalization strips the
          // slash, so every spelling of the combined heading has to be listed here.
          school: ['school', 'office', 'โรงเรียน', 'สถานศึกษา', 'หน่วยงาน',
            'โรงเรียนหน่วยงาน', 'สถานศึกษาหน่วยงาน', 'โรงเรียนสถานศึกษา', 'สถานศึกษาโรงเรียน'],
          trainingType: ['type', 'trainingtype', 'ด้าน', 'ด้านการอบรม', 'ประเภท', 'ประเภทการอบรม', 'หลักสูตร', 'กลุ่มสาระ', 'วิชา'],
          participantStatus: ['participantstatus', 'status', 'สถานะ', 'สถานะผู้เข้าร่วม']
        };
        // Strip every separator a human might type inside a heading, not just spaces.
        const normalizedHeader = matrix[0].map(value => String(value).toLowerCase().replace(/[\s_\-/\\().]/g, ''));
        const indices = IMPORT_FIELDS.map(field => {
          const exact = normalizedHeader.findIndex(value => aliases[field].includes(value));
          if (exact >= 0) return exact;
          // Fall back to a substring match so headings like "ชื่อโรงเรียน" still map.
          return normalizedHeader.findIndex(value => value && aliases[field].some(alias => value.includes(alias)));
        });
        const hasHeader = indices[1] >= 0 && indices[2] >= 0;
        const mappedIndices = hasHeader ? indices : IMPORT_FIELDS.map((field, i) => i);
        const statusFieldIndex = IMPORT_FIELDS.indexOf('participantStatus');
        const dataRows = (hasHeader ? matrix.slice(1) : matrix)
          .filter(row => row.some(value => String(value).trim()))
          .map(row => mappedIndices.map((index, fieldIndex) => {
            const value = index >= 0 ? row[index] : '';
            if (fieldIndex === statusFieldIndex && !String(value).trim()) return 'ผ่านการอบรม';
            return value;
          }));

        const unmatched = IMPORT_FIELDS.filter((field, i) => hasHeader && indices[i] < 0);
        document.getElementById('importTextData').value = dataRows.map(row => row.join('\t')).join('\n');
        document.getElementById('importMappingStatus').textContent = hasHeader
          ? `อ่าน ${dataRows.length} แถว — จับคู่หัวคอลัมน์อัตโนมัติแล้ว${unmatched.length ? ` (ไม่พบคอลัมน์: ${unmatched.join(', ')} จะเว้นว่างไว้)` : ''}`
          : `อ่าน ${dataRows.length} แถว — ใช้ลำดับคอลัมน์มาตรฐาน ${IMPORT_FIELDS.length} ช่อง`;
      } catch (error) {
        showAlert(`อ่านไฟล์ไม่สำเร็จ: ${error.message}`, true);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  /* --- Bulk selection in the certificates registry --- */

  function isCertSelected(certificateId) {
    return (CertiFlowState.selectedCertIds || []).indexOf(certificateId) !== -1;
  }

  function toggleCertSelection(certificateId, checked) {
    const selected = CertiFlowState.selectedCertIds || [];
    const index = selected.indexOf(certificateId);
    if (checked && index === -1) selected.push(certificateId);
    if (!checked && index !== -1) selected.splice(index, 1);
    CertiFlowState.selectedCertIds = selected;
    updateCertSelectionUi();
  }

  /** Select-all applies to the rows currently rendered (i.e. after search filtering). */
  function toggleSelectAllCerts(checked) {
    (CertiFlowState.renderedCertIds || []).forEach(id => {
      const index = CertiFlowState.selectedCertIds.indexOf(id);
      if (checked && index === -1) CertiFlowState.selectedCertIds.push(id);
      if (!checked && index !== -1) CertiFlowState.selectedCertIds.splice(index, 1);
    });
    document.querySelectorAll('.cert-row-check').forEach(box => { box.checked = checked; });
    updateCertSelectionUi();
  }

  function clearCertSelection() {
    CertiFlowState.selectedCertIds = [];
    document.querySelectorAll('.cert-row-check').forEach(box => { box.checked = false; });
    updateCertSelectionUi();
  }

  function updateCertSelectionUi() {
    const selected = CertiFlowState.selectedCertIds || [];
    const rendered = CertiFlowState.renderedCertIds || [];
    const bar = document.getElementById('certBulkBar');
    const label = document.getElementById('certBulkCount');
    const selectAll = document.getElementById('certSelectAll');

    if (label) {
      const roundNote = selected.length > BULK_ROUND_SIZE
        ? ` — เกิน ${BULK_ROUND_SIZE} รายการต่อรอบ ระบบจะแบ่งทำให้อัตโนมัติ ${Math.ceil(selected.length / BULK_ROUND_SIZE)} รอบ`
        : '';
      label.textContent = `เลือกไว้ ${selected.length} รายการ${roundNote}`;
    }
    if (bar) bar.classList.toggle('hidden', selected.length === 0);
    if (selectAll) {
      const selectedOnScreen = rendered.filter(id => selected.indexOf(id) !== -1).length;
      selectAll.checked = rendered.length > 0 && selectedOnScreen === rendered.length;
      selectAll.indeterminate = selectedOnScreen > 0 && selectedOnScreen < rendered.length;
    }
  }

  /** Selected rows split by whether the given statuses allow the action. */
  function partitionSelectedCerts(allowedStatuses) {
    const selected = CertiFlowState.selectedCertIds || [];
    const eligible = [];
    const skipped = [];
    selected.forEach(id => {
      const cert = (CertiFlowState.certificates || []).find(c => c.certificateId === id);
      if (cert && allowedStatuses.indexOf(cert.certificateStatus) !== -1) eligible.push(id);
      else skipped.push(`${id} (${cert ? cert.certificateStatus : 'ไม่พบรายการ'})`);
    });
    return { eligible, skipped };
  }

  /* Server-side cap per bulk call — keep in sync with CertificateService.MAX_BULK_PER_ROUND.
     Larger selections are sent as consecutive rounds of this size so no single Apps Script
     call approaches the 6-minute execution limit. */
  const BULK_ROUND_SIZE = 25;

  function setBulkProgressText(text) {
    const textEl = document.getElementById('certBulkProgressText');
    if (textEl) textEl.textContent = text;
  }

  function showBulkProgress(show) {
    const box = document.getElementById('certBulkProgress');
    const cancelBtn = document.getElementById('btnCancelBulkRun');
    if (box) box.classList.toggle('hidden', !show);
    if (cancelBtn) cancelBtn.classList.toggle('hidden', !show);
  }

  function cancelBulkRun() {
    CertiFlowState.bulkCancelRequested = true;
    setBulkProgressText('จะหยุดหลังจบรอบปัจจุบัน...');
  }

  /**
   * Runs a bulk action over any number of ids by splitting it into rounds of
   * BULK_ROUND_SIZE and calling the API once per round, updating the progress bar.
   * Stops early on a hard error (e.g. session expired) and keeps what already succeeded.
   */
  function runBulkInRounds(action, ids, extraPayload, actionLabel) {
    CertiFlowState.bulkCancelRequested = false;
    const rounds = [];
    for (let i = 0; i < ids.length; i += BULK_ROUND_SIZE) rounds.push(ids.slice(i, i + BULK_ROUND_SIZE));

    const totals = { successCount: 0, failCount: 0, failures: [], processed: 0, stoppedError: '' };
    showBulkProgress(true);
    setBulkProgressText(`${actionLabel}: กำลังเริ่ม ${ids.length} รายการ (รอบละ ${BULK_ROUND_SIZE})`);

    const runRound = (index) => {
      if (index >= rounds.length || CertiFlowState.bulkCancelRequested) return Promise.resolve();
      const chunk = rounds[index];
      setBulkProgressText(`${actionLabel}: รอบที่ ${index + 1}/${rounds.length} — เสร็จแล้ว ${totals.processed}/${ids.length} รายการ`);

      return callApi(action, { ...(extraPayload || {}), certificateIds: chunk })
        .then((result) => {
          totals.successCount += result.successCount || 0;
          totals.failCount += result.failCount || 0;
          totals.processed += result.total || chunk.length;
          (result.results || []).filter(item => !item.success).forEach(item => totals.failures.push(item));
          return runRound(index + 1);
        })
        .catch((err) => {
          // A failed round stops the run; earlier rounds are already saved.
          totals.stoppedError = err.message;
        });
    };

    return runRound(0).then(() => {
      showBulkProgress(false);
      reportBulkResult(actionLabel, totals, ids.length);
    });
  }

  function reportBulkResult(actionLabel, totals, requestedCount) {
    if (totals.failures.length) console.log(`${actionLabel} failures:`, totals.failures);

    const remaining = requestedCount - totals.processed;
    let message = `${actionLabel}สำเร็จ ${totals.successCount} รายการ`;
    if (totals.failCount) message += `, ล้มเหลว ${totals.failCount} รายการ (เช่น ${totals.failures[0].certificateId}: ${totals.failures[0].error})`;
    if (totals.stoppedError) message += ` — หยุดกลางคัน เหลืออีก ${remaining} รายการที่ยังไม่ได้ทำ (${totals.stoppedError}) กรุณาเข้าสู่ระบบใหม่หรือลองอีกครั้งกับรายการที่เหลือ`;
    else if (CertiFlowState.bulkCancelRequested && remaining > 0) message += ` — หยุดตามคำสั่ง เหลืออีก ${remaining} รายการ`;

    showAlert(message, !!(totals.failCount || totals.stoppedError));
    loadCertificatesList();
  }

  function handleBulkIssueCerts() {
    const { eligible, skipped } = partitionSelectedCerts(['DRAFT', 'PENDING']);
    if (!eligible.length) {
      return showAlert('ไม่มีรายการที่ออกเลขได้ในสิ่งที่เลือก (ออกเลขได้เฉพาะ DRAFT/PENDING)', true);
    }

    const skipNote = skipped.length ? ` — ข้าม ${skipped.length} รายการที่ออกเลขไปแล้วหรือถูกยกเลิก` : '';
    const roundNote = eligible.length > BULK_ROUND_SIZE
      ? ` ระบบจะแบ่งทำเป็น ${Math.ceil(eligible.length / BULK_ROUND_SIZE)} รอบ รอบละไม่เกิน ${BULK_ROUND_SIZE} รายการ (ห้ามปิดหน้านี้ระหว่างทำงาน)`
      : '';
    showConfirm(`ออกเลขเกียรติบัตร ${eligible.length} รายการหรือไม่?${roundNote}${skipNote}`).then((ok) => {
      if (!ok) return;
      runBulkInRounds('issueCertificates', eligible, {}, 'ออกเลขเกียรติบัตร');
    });
  }

  function openBulkRevokeModal() {
    const { eligible, skipped } = partitionSelectedCerts(['ISSUED']);
    if (!eligible.length) {
      return showAlert('ไม่มีรายการที่ยกเลิกได้ในสิ่งที่เลือก (ยกเลิกได้เฉพาะสถานะ ISSUED)', true);
    }

    document.getElementById('lblBulkRevokeSummary').textContent = `คุณกำลังยกเลิกเกียรติบัตร ${eligible.length} รายการ`;
    const skippedBox = document.getElementById('lblBulkRevokeSkipped');
    skippedBox.classList.toggle('hidden', skipped.length === 0);
    if (skipped.length) skippedBox.textContent = `ข้าม ${skipped.length} รายการที่ไม่ใช่สถานะ ISSUED: ${skipped.join(', ')}`;
    document.getElementById('bulkRevokeReasonText').value = '';

    const modal = document.getElementById('bulkRevokeModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeBulkRevokeModal() {
    const modal = document.getElementById('bulkRevokeModal');
    if (modal) modal.classList.add('hidden');
  }

  function handleConfirmBulkRevoke(e) {
    e.preventDefault();
    const reason = document.getElementById('bulkRevokeReasonText').value.trim();
    const { eligible } = partitionSelectedCerts(['ISSUED']);
    if (!eligible.length) return showAlert('ไม่มีรายการที่ยกเลิกได้', true);

    closeBulkRevokeModal();
    runBulkInRounds('revokeCertificates', eligible, { reason }, 'ยกเลิกเกียรติบัตร');
  }

  function handleBulkDeleteCerts() {
    if (!CertiFlowState.currentUser || CertiFlowState.currentUser.role !== 'ADMIN') {
      return showAlert('ลบถาวรได้เฉพาะ ADMIN เท่านั้น', true);
    }
    const { eligible, skipped } = partitionSelectedCerts(['DRAFT', 'PENDING', 'REVOKED']);
    if (!eligible.length) {
      return showAlert('ไม่มีรายการที่ลบได้ในสิ่งที่เลือก (ลบได้เฉพาะ DRAFT/PENDING/REVOKED)', true);
    }

    const skipNote = skipped.length ? ` — ข้าม ${skipped.length} รายการที่ยังเป็น ISSUED: ${skipped.join(', ')}` : '';
    const roundNote = eligible.length > BULK_ROUND_SIZE ? ` ระบบจะแบ่งทำเป็นรอบละไม่เกิน ${BULK_ROUND_SIZE} รายการ` : '';
    showConfirm(`ลบเกียรติบัตร ${eligible.length} รายการถาวรหรือไม่? กู้คืนไม่ได้${roundNote}${skipNote}`).then((ok) => {
      if (!ok) return;
      runBulkInRounds('deleteCertificates', eligible, {}, 'ลบเกียรติบัตร');
    });
  }

  function filterCertificatesTable() {
    const q = document.getElementById('certSearchQuery').value.toLowerCase().trim();
    if (!q) {
      renderCertificatesTable(CertiFlowState.certificates);
      return;
    }
    const filtered = CertiFlowState.certificates.filter(c => {
      const name = `${c.prefixName}${c.firstName} ${c.lastName}`.toLowerCase();
      const no = (c.certificateNo || '').toLowerCase();
      const school = (c.school || '').toLowerCase();
      return name.includes(q) || no.includes(q) || school.includes(q);
    });
    renderCertificatesTable(filtered);
  }

  function exportCertificatesToExcel() {
    if (typeof XLSX === 'undefined') return showAlert('ตัวสร้างไฟล์ XLSX โหลดไม่สำเร็จ', true);
    const certs = CertiFlowState.certificates || [];
    if (!certs.length) return showAlert('ไม่มีข้อมูลในทะเบียนสำหรับดาวน์โหลด', true);

    const activitySelect = document.getElementById('certActivitySelect');
    const activityLabel = activitySelect && activitySelect.selectedOptions.length
      ? activitySelect.selectedOptions[0].textContent
      : 'ทุกกิจกรรม';

    const header = ['Certificate ID', 'เลขที่เกียรติบัตร', 'คำนำหน้า', 'ชื่อ', 'นามสกุล', 'โรงเรียน/หน่วยงาน', 'ด้านการอบรม', 'สถานะผู้เข้าร่วม', 'สถานะเกียรติบัตร'];
    const rows = certs.map(c => [
      c.certificateId || '',
      c.certificateNo || '',
      c.prefixName || '',
      c.firstName || '',
      c.lastName || '',
      c.school || '',
      c.trainingType || '',
      c.participantStatus || '',
      c.certificateStatus || ''
    ]);

    const sheet = XLSX.utils.aoa_to_sheet([header, ...rows]);
    sheet['!cols'] = header.map(() => ({ wch: 20 }));
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, 'Certificates');
    const safeLabel = activityLabel.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
    XLSX.writeFile(workbook, `CertiFlow_ทะเบียนเกียรติบัตร_${safeLabel}.xlsx`);
  }

  function handleIssueCert(certificateId) {
    callApi('issueCertificate', { certificateId })
      .then((issued) => {
        showAlert(`ออกเลขที่เกียรติบัตร ${issued.certificateNo} สำเร็จ`);
        loadCertificatesList();
      })
      .catch((err) => showAlert(`ออกเลขไม่สำเร็จ: ${err.message}`, true));
  }

  function handleDeleteCert(certificateId) {
    showConfirm(`ลบ ${certificateId} ถาวรหรือไม่? ทำได้เฉพาะใบที่ยังไม่เคยออกเลข (DRAFT/PENDING) หรือถูกยกเลิกแล้ว (REVOKED) และกู้คืนไม่ได้`).then((ok) => {
      if (!ok) return;
      callApi('deleteCertificate', { certificateId })
        .then(() => { showAlert('ลบรายการเรียบร้อย'); loadCertificatesList(); })
        .catch(err => showAlert(`ลบไม่สำเร็จ: ${err.message}`, true));
    });
  }

  function openEditCertModal(certificateId) {
    const cert = CertiFlowState.certificates.find(c => c.certificateId === certificateId);
    if (!cert) return;

    document.getElementById('editCertId').value = cert.certificateId;
    document.getElementById('lblEditCertId').textContent = cert.certificateId;
    document.getElementById('editCertPrefix').value = cert.prefixName || '';
    document.getElementById('editCertFirst').value = cert.firstName || '';
    document.getElementById('editCertLast').value = cert.lastName || '';
    document.getElementById('editCertSchool').value = cert.school || '';
    document.getElementById('editCertTrainingType').value = cert.trainingType || '';

    const modal = document.getElementById('editCertModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeEditCertModal() {
    const modal = document.getElementById('editCertModal');
    if (modal) modal.classList.add('hidden');
  }

  function handleSaveEditCert(e) {
    e.preventDefault();
    const certificateId = document.getElementById('editCertId').value;
    const updates = {
      prefixName: document.getElementById('editCertPrefix').value,
      firstName: document.getElementById('editCertFirst').value,
      lastName: document.getElementById('editCertLast').value,
      school: document.getElementById('editCertSchool').value,
      trainingType: document.getElementById('editCertTrainingType').value
    };

    callApi('updateCertificate', { certificateId, updates })
      .then(() => {
        showAlert('แก้ไขข้อมูลเกียรติบัตรเรียบร้อย');
        closeEditCertModal();
        loadCertificatesList();
      })
      .catch((err) => showAlert(`แก้ไขล้มเหลว: ${err.message}`, true));
  }

  function openRevokeCertModal(certificateId) {
    document.getElementById('revokeCertId').value = certificateId;
    document.getElementById('lblRevokeCertId').textContent = certificateId;
    document.getElementById('revokeReasonText').value = '';

    const modal = document.getElementById('revokeCertModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeRevokeCertModal() {
    const modal = document.getElementById('revokeCertModal');
    if (modal) modal.classList.add('hidden');
  }

  function handleConfirmRevoke(e) {
    e.preventDefault();
    const certificateId = document.getElementById('revokeCertId').value;
    const reason = document.getElementById('revokeReasonText').value.trim();

    callApi('revokeCertificate', { certificateId, reason })
      .then(() => {
        showAlert(`ยกเลิกเกียรติบัตร ${certificateId} เรียบร้อยแล้ว`);
        closeRevokeCertModal();
        loadCertificatesList();
      })
      .catch((err) => showAlert(`ยกเลิกล้มเหลว: ${err.message}`, true));
  }

  function openReissueCertModal(certificateId) {
    document.getElementById('reissueCertId').value = certificateId;
    document.getElementById('lblReissueCertId').textContent = certificateId;
    document.getElementById('reissueReasonText').value = '';

    const modal = document.getElementById('reissueCertModal');
    if (modal) modal.classList.remove('hidden');
  }

  function closeReissueCertModal() {
    const modal = document.getElementById('reissueCertModal');
    if (modal) modal.classList.add('hidden');
  }

  function handleConfirmReissue(e) {
    e.preventDefault();
    const certificateId = document.getElementById('reissueCertId').value;
    const reason = document.getElementById('reissueReasonText').value.trim();

    callApi('reissueCertificate', { certificateId, reason })
      .then((reissued) => {
        showAlert(`ออกเกียรติบัตรใหม่แทน ${certificateId} เรียบร้อยแล้ว ระบบคงเลขที่เดิม ${reissued.certificateNo || '-'} ไว้ กรุณากด "ออกเลข" เพื่อยืนยันการออกอีกครั้ง`);
        closeReissueCertModal();
        loadCertificatesList();
      })
      .catch((err) => showAlert(`ออกใหม่ล้มเหลว: ${err.message}`, true));
  }

  /* ==========================================================================
     6. SETTINGS & AUDIT LOGS MANAGEMENT
     ========================================================================== */

  function initSettingsPage() {
    loadSettingsForm();
    loadCertificateReports();
    loadUsersList();
    loadAuditLogsList();
  }

  function loadCertificateReports() {
    callApi('getReports').then(reports => {
      const tbody = document.getElementById('certificateReportsBody');
      if (!tbody) return;
      tbody.innerHTML = reports.length ? reports.map(report => `<tr class="border-t"><td class="p-2 font-mono">${escapeHtml(report.certificateId)}</td><td class="p-2">${escapeHtml(report.message)}</td><td class="p-2">${escapeHtml(report.contact || '—')}</td><td class="p-2 text-center">${escapeHtml(report.status)}</td><td class="p-2">${report.status === 'OPEN' ? `<button onclick="resolveCertificateReport('${report.reportId}')" class="text-emerald-700 underline">ปิดเรื่อง</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="5" class="p-4 text-center text-slate-400">ไม่มีรายงาน</td></tr>';
    }).catch(err => console.log('Reports load error:', err));
  }

  function resolveCertificateReport(reportId) {
    callApi('resolveReport', { reportId })
      .then(() => loadCertificateReports())
      .catch(err => showAlert(`ปิดรายงานไม่สำเร็จ: ${err.message}`, true));
  }

  function loadSettingsForm() {
    callApi('getSettings').then(settings => {
      document.getElementById('cfgSystemName').value = settings.SYSTEM_NAME || '';
      document.getElementById('cfgOrganization').value = settings.ORGANIZATION || '';
      document.getElementById('cfgWebAppUrl').value = settings.WEB_APP_URL || '';
      document.getElementById('cfgTemplateFolder').value = settings.TEMPLATE_FOLDER_ID || '';
      document.getElementById('cfgTempFolder').value = settings.TEMP_FOLDER_ID || '';
      document.getElementById('cfgTimezone').value = settings.DEFAULT_TIMEZONE || 'Asia/Bangkok';
      document.getElementById('cfgDbId').textContent = settings.DATABASE_SPREADSHEET_ID_MASKED || 'ยังไม่ตั้งค่า';
    }).catch(err => showAlert(`โหลด Settings ไม่สำเร็จ: ${err.message}`, true));
  }

  function handleSaveSettings(event) {
    event.preventDefault();
    const settings = {
      SYSTEM_NAME: document.getElementById('cfgSystemName').value,
      ORGANIZATION: document.getElementById('cfgOrganization').value,
      WEB_APP_URL: document.getElementById('cfgWebAppUrl').value,
      TEMPLATE_FOLDER_ID: document.getElementById('cfgTemplateFolder').value,
      TEMP_FOLDER_ID: document.getElementById('cfgTempFolder').value,
      DEFAULT_TIMEZONE: document.getElementById('cfgTimezone').value
    };
    callApi('updateSettings', { settings })
      .then(() => showAlert('บันทึกการตั้งค่าเรียบร้อย'))
      .catch(err => showAlert(`บันทึก Settings ไม่สำเร็จ: ${err.message}`, true));
  }

  function loadUsersList() {
    callApi('getUsers')
      .then((users) => {
        CertiFlowState.users = users || [];
        const tbody = document.getElementById('userTableBody');
        if (!tbody) return;

        if (!users || users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-center text-slate-400">ยังไม่มีผู้ใช้งานในระบบ</td></tr>';
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr>
            <td class="px-4 py-2.5 font-mono font-medium text-slate-900">${escapeHtml(u.userId)}</td>
            <td class="px-4 py-2.5 text-slate-600">${escapeHtml(u.name)}</td>
            <td class="px-4 py-2.5 text-center">
              <span class="px-2 py-0.5 rounded text-xs font-semibold ${u.role === 'ADMIN' ? 'bg-navy-100 text-navy-800' : 'bg-slate-100 text-slate-700'}">${escapeHtml(u.role)}</span>
            </td>
            <td class="px-4 py-2.5 text-center">
              <span class="px-2 py-0.5 rounded text-xs font-semibold ${u.status === 'ACTIVE' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${escapeHtml(u.status)}</span>
            </td>
            <td class="px-4 py-2.5 text-xs text-slate-500">${escapeHtml(u.lastLogin || '-')}</td>
            <td class="px-4 py-2.5 text-right"><button onclick="openUserModal('${escapeHtml(u.userId)}')" class="px-2 py-1 bg-slate-100 rounded">แก้ไข</button></td>
          </tr>
        `).join('');
      })
      .catch((err) => console.log('Users load error:', err));
  }

  function openUserModal(userId = '') {
    const modal = document.getElementById('userModal');
    const user = CertiFlowState.users.find(item => item.userId === userId);
    document.getElementById('userForm').reset();
    document.getElementById('userModalTitle').textContent = user ? `แก้ไขผู้ใช้ ${user.userId}` : 'เพิ่มผู้ใช้ใหม่';
    document.getElementById('usrUserId').readOnly = !!user;
    document.getElementById('usrPassword').required = !user;
    document.getElementById('usrPassword').placeholder = user ? 'เว้นว่างหากไม่เปลี่ยนรหัสผ่าน' : '';
    if (user) {
      document.getElementById('usrUserId').value = user.userId;
      document.getElementById('usrName').value = user.name || '';
      document.getElementById('usrEmail').value = user.email || '';
      document.getElementById('usrRole').value = user.role;
      document.getElementById('usrStatus').value = user.status;
    }
    if (modal) modal.classList.remove('hidden');
  }

  function closeUserModal() {
    const modal = document.getElementById('userModal');
    if (modal) modal.classList.add('hidden');
  }

  function handleSaveUser(e) {
    e.preventDefault();
    const payload = {
      userId: document.getElementById('usrUserId').value,
      name: document.getElementById('usrName').value,
      email: document.getElementById('usrEmail').value,
      password: document.getElementById('usrPassword').value,
      role: document.getElementById('usrRole').value,
      status: document.getElementById('usrStatus').value
    };

    callApi('manageUser', payload)
      .then(() => {
        showAlert(`บันทึกผู้ใช้ ${payload.userId} เรียบร้อยแล้ว`);
        closeUserModal();
        document.getElementById('userForm').reset();
        loadUsersList();
      })
      .catch((err) => showAlert(`บันทึกผู้ใช้ล้มเหลว: ${err.message}`, true));
  }

  function loadAuditLogsList() {
    const payload = {
      action: document.getElementById('auditActionFilter') ? document.getElementById('auditActionFilter').value : '',
      entityType: document.getElementById('auditEntityFilter') ? document.getElementById('auditEntityFilter').value : '',
      actor: document.getElementById('auditActorFilter') ? document.getElementById('auditActorFilter').value : ''
    };
    callApi('getAuditLogs', payload)
      .then((data) => {
        const tbody = document.getElementById('auditLogsTableBody');
        if (!tbody) return;

        const logs = data.logs || [];
        CertiFlowState.auditLogs = logs;
        if (logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-center text-slate-400 font-sans">ยังไม่มี Audit Logs บันทึกไว้</td></tr>';
          return;
        }

        tbody.innerHTML = logs.map((l, index) => `
          <tr>
            <td class="px-3 py-2 text-slate-500">${escapeHtml(l.logId)}</td>
            <td class="px-3 py-2 font-bold text-navy-600">${escapeHtml(l.action)}</td>
            <td class="px-3 py-2 text-slate-700">${escapeHtml(l.entityType)} (${escapeHtml(l.entityId)})</td>
            <td class="px-3 py-2 text-slate-600">${escapeHtml(l.actorEmail)}</td>
            <td class="px-3 py-2 text-slate-600 font-sans">${escapeHtml(l.note || '-')} <button onclick="showAuditDetail(${index})" class="text-navy-600 underline">before/after</button></td>
            <td class="px-3 py-2 text-slate-400 text-[10px]">${escapeHtml(l.createdAt)}</td>
          </tr>
        `).join('');
      })
      .catch((err) => console.log('Audit logs error:', err));
  }

  function showAuditDetail(index) {
    const log = (CertiFlowState.auditLogs || [])[index];
    if (!log) return;
    const pre = document.createElement('pre');
    pre.className = 'text-xs whitespace-pre-wrap text-left w-full bg-slate-50 p-4 rounded';
    const pretty = value => {
      try { return JSON.stringify(JSON.parse(value || '{}'), null, 2); }
      catch (e) { return value || '—'; }
    };
    pre.textContent = `BEFORE\n${pretty(log.beforeJson)}\n\nAFTER\n${pretty(log.afterJson)}`;
    openMediaModal(`Audit ${log.logId}`, pre);
  }
</script>
