<!-- Activities Management Partial -->
<section id="activitiesSection" class="space-y-6">
  <div class="flex justify-between items-center">
    <h2 class="text-xl font-bold text-navy-900">จัดการกิจกรรม (Activities)</h2>
    <button id="btnNewActivity" data-admin-only onclick="openActivityModal()" class="px-4 py-2 bg-navy-800 hover:bg-navy-900 text-white text-sm font-medium rounded-md shadow-sm transition">
      + สร้างกิจกรรมใหม่
    </button>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <table class="min-w-full divide-y divide-slate-200 text-sm">
      <thead class="bg-slate-50 text-slate-700 font-medium">
        <tr>
          <th class="px-4 py-3 text-left">ID</th>
          <th class="px-4 py-3 text-left">ชื่อกิจกรรม</th>
          <th class="px-4 py-3 text-left">หน่วยงานออก</th>
          <th class="px-4 py-3 text-left">รูปแบบเลขเกียรติบัตร</th>
          <th class="px-4 py-3 text-center">สถานะ</th>
          <th class="px-4 py-3 text-right">จัดการ</th>
        </tr>
      </thead>
      <tbody id="activityTableBody" class="divide-y divide-slate-200">
        <tr>
          <td colspan="6" class="px-4 py-6 text-center text-slate-400">กำลังโหลดข้อมูล...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<!-- Activity Form Modal -->
<div id="activityModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 id="activityModalTitle" class="text-lg font-bold text-slate-900">สร้างกิจกรรมใหม่</h3>
      <button onclick="closeActivityModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
    </div>

    <form id="activityForm" onsubmit="handleSaveActivity(event)" class="space-y-4 text-sm">
      <input type="hidden" id="actId">

      <div>
        <label class="block font-medium text-slate-700 mb-1">ชื่อกิจกรรม *</label>
        <input type="text" id="actName" required placeholder="เช่น อบรมเชิงปฏิบัติการพัฒนาข้อสอบ..." class="w-full rounded-md border p-2 border-slate-300">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-slate-700 mb-1">ผู้จัด (Organizer) *</label>
          <input type="text" id="actOrganizer" required placeholder="เช่น กลุ่มนิเทศ ติดตามฯ" class="w-full rounded-md border p-2 border-slate-300">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">หน่วยงานที่ออก (Issue Agency) *</label>
          <input type="text" id="actIssueAgency" required placeholder="เช่น สพม.พลอต" class="w-full rounded-md border p-2 border-slate-300">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block font-medium text-slate-700 mb-1">วันที่เริ่ม</label>
          <input type="date" id="actStartDate" class="w-full rounded-md border p-2 border-slate-300 focus:border-navy-500 focus:ring-1 focus:ring-navy-500 outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">วันที่สิ้นสุด</label>
          <input type="date" id="actEndDate" class="w-full rounded-md border p-2 border-slate-300 focus:border-navy-500 focus:ring-1 focus:ring-navy-500 outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">วันที่ออกใบเกียรติบัตร</label>
          <input type="date" id="actIssueDate" class="w-full rounded-md border p-2 border-slate-300 focus:border-navy-500 focus:ring-1 focus:ring-navy-500 outline-none">
        </div>
      </div>

      <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-3">
        <h4 class="font-bold text-slate-800 text-xs uppercase tracking-wider">ตั้งค่าเลขที่เกียรติบัตร</h4>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs text-slate-600 mb-1">ข้อความนำหน้า</label>
            <input type="text" id="actPrefixText" value="เลขที่" class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">ชื่อย่อ (Prefix)</label>
            <input type="text" id="actPrefix" placeholder="สพม.พลอต" class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">ปี พ.ศ.</label>
            <input type="text" id="actYear" value="2569" class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">รูปแบบตัวเลข</label>
            <select id="actNumberFormat" class="w-full rounded-md border p-1.5 border-slate-300 text-xs bg-white">
              <option value="ARABIC">เลขอารบิก (2221)</option>
              <option value="THAI">เลขไทย (๒๒๒๑)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">เลขเริ่มต้น</label>
            <input type="number" id="actStartNumber" min="0" value="1" required class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">เลขสิ้นสุด</label>
            <input type="number" id="actEndNumber" min="1" value="9999" required class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">จำนวนหลัก</label>
            <input type="number" id="actDigitLength" min="1" max="12" value="4" required class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-600 mb-1">ตัวคั่น</label>
            <input type="text" id="actSeparator" maxlength="5" value="/" required class="w-full rounded-md border p-1.5 border-slate-300 text-xs">
          </div>
        </div>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">Google Slides Template ID *</label>
        <div class="flex space-x-2">
          <input type="text" id="actTemplateId" required placeholder="เช่น 1A2B3C4D5E..." class="flex-1 rounded-md border p-2 border-slate-300 font-mono text-xs">
          <button type="button" onclick="handleValidateTemplateBtn()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-md text-xs">
            ตรวจ Template
          </button>
          <button type="button" id="btnPreviewTemplate" onclick="handlePreviewTemplateBtn()" class="px-3 py-2 bg-navy-50 hover:bg-navy-100 text-navy-700 border border-navy-200 font-medium rounded-md text-xs">
            Preview
          </button>
        </div>
        <div id="templateCheckResult" class="mt-2 text-xs"></div>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">ด้านการอบรม (ค่าตั้งต้นของกิจกรรม)</label>
        <input type="text" id="actTrainingType" placeholder="เช่น ด้านการอ่าน, ด้านคณิตศาสตร์, ด้านวิทยาศาสตร์" class="w-full rounded-md border p-2 border-slate-300">
        <p class="text-xs text-slate-500 mt-1">ใช้แทนที่ <span class="font-mono bg-slate-100 px-1 rounded">{{type}}</span> ในเกียรติบัตร — ถ้าไฟล์นำเข้ามีคอลัมน์ "ด้านการอบรม" ระบบจะใช้ค่าของแต่ละคนก่อน แล้วค่อยใช้ค่านี้เป็นค่าตั้งต้นเมื่อเว้นว่าง</p>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">สถานะกิจกรรม</label>
        <select id="actStatus" class="w-full rounded-md border p-2 border-slate-300 bg-white">
          <option value="DRAFT">DRAFT (ร่าง)</option>
          <option value="ACTIVE">ACTIVE (เปิดใช้งาน)</option>
          <option value="CLOSED">CLOSED (ปิด)</option>
        </select>
      </div>

      <div class="flex justify-end space-x-3 pt-4 border-t">
        <button type="button" onclick="closeActivityModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium">ยกเลิก</button>
        <button type="submit" id="btnSaveAct" class="px-5 py-2 bg-navy-800 hover:bg-navy-900 text-white rounded-md font-medium">บันทึกกิจกรรม</button>
      </div>
    </form>
  </div>
</div>
