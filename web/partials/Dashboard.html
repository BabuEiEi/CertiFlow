<!-- Management Dashboard Partial -->
<section id="dashboardSection" class="space-y-6">
  <div class="flex justify-between items-center">
    <h2 class="text-xl font-bold text-navy-900">ภาพรวมระบบ (Dashboard)</h2>
    <button id="btnRefreshDashboard" onclick="loadDashboardData()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium rounded-md transition">
      รีเฟรชข้อมูล
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
    <div class="bg-white p-5 rounded-xl border border-slate-200 border-t-4 border-t-navy-800 shadow-sm">
      <p class="text-xs font-medium text-slate-500">กิจกรรมทั้งหมด</p>
      <p id="statActivities" class="text-2xl font-bold text-navy-900 mt-1">0</p>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 border-t-4 border-t-navy-800 shadow-sm">
      <p class="text-xs font-medium text-slate-500">ผู้เข้าร่วมทั้งหมด</p>
      <p id="statParticipants" class="text-2xl font-bold text-navy-900 mt-1">0</p>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 border-t-4 border-t-gold-500 shadow-sm">
      <p class="text-xs font-medium text-slate-500">ออกเกียรติบัตรแล้ว</p>
      <p id="statIssued" class="text-2xl font-bold text-gold-700 mt-1">0</p>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 border-t-4 border-t-amber-400 shadow-sm">
      <p class="text-xs font-medium text-slate-500">รอดำเนินการ</p>
      <p id="statPending" class="text-2xl font-bold text-amber-600 mt-1">0</p>
    </div>
    <div class="bg-white p-5 rounded-xl border border-slate-200 border-t-4 border-t-rose-400 shadow-sm">
      <p class="text-xs font-medium text-slate-500">ถูกยกเลิก (Revoked)</p>
      <p id="statRevoked" class="text-2xl font-bold text-rose-600 mt-1">0</p>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4">
    <h3 class="text-base font-bold text-slate-900">สรุปข้อมูลตามกิจกรรม</h3>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200 text-sm">
        <thead class="bg-slate-50 text-slate-700 font-medium">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>
            <th class="px-4 py-3 text-left">ชื่อกิจกรรม</th>
            <th class="px-4 py-3 text-center">ผู้เข้าร่วม</th>
            <th class="px-4 py-3 text-center">ออกแล้ว (ISSUED)</th>
            <th class="px-4 py-3 text-center">สถานะ</th>
          </tr>
        </thead>
        <tbody id="dashboardActivitySummary" class="divide-y divide-slate-200 text-slate-700">
          <tr>
            <td colspan="5" class="px-4 py-6 text-center text-slate-400">กำลังโหลดข้อมูล...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
